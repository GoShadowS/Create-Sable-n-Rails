plugins {
    id 'net.neoforged.moddev' version '2.0.140'
}

group = project.mod_group
version = project.mod_version

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    // Registrate is not published to Maven Central or maven.createmod.net; it lives on IThundxr's
    // snapshot repository. Scoped to this one group so the build never resolves anything else from it.
    maven {
        url = 'https://maven.ithundxr.dev/snapshots'
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
    // Veil is not on Maven Central, maven.neoforged.net or maven.createmod.net; Sable's own build
    // resolves foundry.veil from BlameJared (sable buildSrc/.../multiloader-common.gradle:50-53).
    // BlameJared also serves the two jars Veil declares as api/jarJar dependencies
    // (Veil 4.3.2 common/build.gradle:26-27 and neoforge/build.gradle:56-57), so the filter must let them through.
    maven {
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'foundry.veil'
            includeGroup 'gg.moonflower'
            includeGroup 'io.github.ocelot'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                url = 'https://maven.ryanhcode.dev/releases'
                name = 'RyanHCode Maven'
            }
        }
        filter {
            includeGroup('dev.ryanhcode.sable')
            includeGroup('dev.ryanhcode.sable-companion')
        }
    }
}

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            gameDirectory = project.file("runs/${name}")
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Dedicated server GameTest run: executes the tests under src/main/java/.../gametest
        // headlessly, which is the only automated in-game verification available without a client.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('build/gametest')
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            // GameTests live in the main source set because NeoForge only discovers structures and
            // test classes that are part of the mod's own jar/source set.
        }
    }
}

dependencies {
    // sable-neoforge already contains the common sources (Sable buildSrc/.../multiloader-loader.gradle:28-46)
    // and both modules advertise capability dev.ryanhcode.sable:sable:2.0.6, so declaring both is a
    // capability conflict. This project imports no Sable API, so no compile-classpath variant is needed.
    runtimeOnly "dev.ryanhcode.sable:sable-neoforge-${project.minecraft_version}:${project.sable_version}"
    implementation("com.simibubi.create:create-${project.minecraft_version}:${project.create_version}") {
        transitive = false
    }
    implementation "net.createmod.ponder:ponder-neoforge:${project.ponder_version}+mc${project.minecraft_version}"
    implementation "dev.engine-room.flywheel:flywheel-neoforge-${project.minecraft_version}:${project.flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${project.registrate_version}"

    testImplementation(enforcedPlatform('org.junit:junit-bom:5.10.2'))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.resources.srcDir 'src/generated/resources'

test {
    useJUnitPlatform()
}
